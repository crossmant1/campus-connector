name: Publish Docker image

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-main
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.event.workflow_run.head_sha }}

      - name: Pull image for smoke test
        run: docker pull "${{ steps.image.outputs.name }}:${{ github.event.workflow_run.head_sha }}"

      - name: Start API container
        run: |
          docker run --detach --name campusconnect-smoke --network host \
            -e PORT=5000 \
            -e REDIS_URL=redis://127.0.0.1:6379 \
            -e JWT_SECRET=smoke_test_secret \
            -e JWT_REFRESH_SECRET=smoke_test_refresh_secret \
            "${{ steps.image.outputs.name }}:${{ github.event.workflow_run.head_sha }}"

      - name: Smoke-test API health endpoint
        run: |
          for attempt in {1..12}; do
            response=$(curl --silent --show-error --fail http://127.0.0.1:5000/health) && {
              echo "$response" | grep -q '"status":"ok"' && exit 0
            }
            sleep 5
          done
          docker logs campusconnect-smoke
          exit 1

      - name: Remove smoke-test container
        if: always()
        run: docker rm --force campusconnect-smoke || true

