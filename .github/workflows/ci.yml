name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: campusconnect
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: campusconnect_test
        options: >-
          --health-cmd "pg_isready -U campusconnect"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://campusconnect:test_password@localhost:5432/campusconnect_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test_secret
      JWT_REFRESH_SECRET: test_refresh_secret
      NEXT_PUBLIC_API_URL: http://localhost:5000
      NEXT_PUBLIC_WS_URL: ws://localhost:5000

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        run: npm run migrate

      - name: Run tests
        run: npm test -- --passWithNoTests

      - name: Build Next.js
        run: npx next build

      - name: Build Docker image
        run: docker build -t campusconnect:ci .
