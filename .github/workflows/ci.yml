name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: campusconnect
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: campusconnect_test
        options: >-
          --health-cmd "pg_isready -U campusconnect -d campusconnect_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://campusconnect:test_password@127.0.0.1:5432/campusconnect_test
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: test_secret
      JWT_REFRESH_SECRET: test_refresh_secret
      NEXT_PUBLIC_API_URL: http://127.0.0.1:5000
      NEXT_PUBLIC_WS_URL: ws://127.0.0.1:5000

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        run: npm run migrate
        env:
          NODE_ENV: test

      - name: Run tests
        run: npm test -- --passWithNoTests
        env:
          NODE_ENV: test

      - name: Build Next.js
        run: npx next build

      - name: Build Docker image
        run: docker build -t campusconnect:ci .
